name: pptools
description: Guidance for the pptools directory (Perl utilities and helpers).
triggers:
  - "pptools/"
  - "pptools script"
permissions:
  read: true
  run: true
commands:
  - id: list_scripts
    description: List executable Perl scripts in pptools/ with brief one-line descriptions (from shebang or header).
    inputs:
      path: string (default: "pptools/")
    outputs:
      - scripts: list
  - id: run_pptool
    description: Execute a specific pptools script and return output plus suggested tests.
    inputs:
      script: string
      args: list (optional)
    outputs:
      - status: enum [success, failed, errored]
      - stdout: string
      - stderr: string
  - id: suggest_perl_guidelines
    description: Produce repository-specific Perl guidelines for pptools (idioms, modules, testing).
    inputs:
      desired_style: string (optional)
    outputs:
      - guidelines: string
notes: |
  - When suggesting guidelines, cover module usage (strict, warnings, modern Perl), testing (Test::More, prove),
    and packaging if useful (Makefile.PL or Dist::Zilla).
  - Point out any hard-coded paths, environment assumptions, or external dependencies.
  - For changes that modify behavior, recommend adding/adjusting tests under tools/t or pptools/t.
